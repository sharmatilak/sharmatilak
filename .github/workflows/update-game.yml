name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'      # Daily at midnight UTC
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write             # Required for the action to push the GIF

concurrency:
  group: space-shooter
  cancel-in-progress: false   # Prevents overlapping runs from racing each other

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2      # Required for gh-space-shooter's amend logic
          ref: main           # Explicitly checkout the branch

      - name: Generate and commit space shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'sharmatilak-space-shooter.gif'
          strategy: 'random'
